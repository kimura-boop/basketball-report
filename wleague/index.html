<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wリーグ FUTURE 分析</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.hero p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:10px 14px}
.tc:hover{background:var(--soft)}
.tc .nm{font-weight:700;font-size:.92rem;line-height:1.35}
.tc .rec{font-family:var(--num);font-size:1.3rem;font-weight:600}
.day{margin-bottom:14px}
.day h3{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 0 6px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.gm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
a.gm:hover{background:var(--soft)}
.gm .h,.gm .a{font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.gm .a{justify-content:flex-end;text-align:right}
.gm .sc{font-family:var(--num);font-weight:700;font-size:1.25rem;white-space:nowrap}
.gm .win{font-weight:700}
.gm .sc{text-align:center;line-height:1.15}
.flash{display:block;font-family:var(--body);font-size:.66rem;font-weight:700;color:var(--minus);letter-spacing:.08em}
.gm .vs{font-family:var(--num);color:var(--muted);font-size:.9rem;text-align:center;line-height:1.2}
.gm .vs small{display:block;font-size:.72rem}
.streak{font-family:var(--num);letter-spacing:.06em}
.streak b{display:inline-block;width:16px;text-align:center;border-radius:3px;margin-right:2px;color:#fff;font-size:.78rem}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app"><div class="loading">日程と結果を読み込んでいます…</div></main>
<script src="assets/core.js"></script>
<script>
(async function(){
  const app=document.getElementById('app');WL.topbar();
  let S;try{S=await WL.loadSchedule();}catch(e){WL.showError(app,e);return;}
  const esc=WL.esc,C=WL.CONFIG.teams;
  const done=S.games.filter(g=>g.final),todo=S.games.filter(g=>!g.final&&g.status!=='cancel');
  // standings
  const st={};Object.keys(C).forEach(id=>st[id]={id:+id,w:0,l:0,pf:0,pa:0,res:[]});
  done.forEach(g=>{for(const [me,op] of [[g.home,g.away],[g.away,g.home]]){const r=st[me.id];if(!r)continue;const win=me.score>op.score;win?r.w++:r.l++;r.pf+=me.score;r.pa+=op.score;r.res.push(win?'W':'L');}});
  const table=Object.values(st).sort((a,b)=>(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1))||(b.pf-b.pa)-(a.pf-a.pa)||b.w-a.w);
  const byDate=list=>{const m={};list.forEach(g=>(m[g.date]=m[g.date]||[]).push(g));return Object.entries(m);};
  const recent=byDate(done).slice(-3).reverse(), upcoming=byDate(todo).slice(0,4);
  const dlabel=(d,wd)=>{const [y,m,dd]=d.split('-');return `${+m}月${+dd}日（${wd}）`;};
  const card=g=>{
    const hw=g.final&&g.home.score>g.away.score,aw=g.final&&g.away.score>g.home.score;
    const side=(t,w,cls)=>`<span class="${cls}${w?' win':''}"><i class="dot" style="background:${(C[t.id]||{}).color||'#999'}"></i>${esc(t.short)}</span>`;
    const mid=g.final?`<span class="sc">${g.home.score} - ${g.away.score}${g.provisional?'<small class="flash">速報</small>':''}</span>`:`<span class="vs">${esc(g.time)}<small>${esc(g.venue)}</small></span>`;
    const inner=side(g.home,hw,'h')+mid+side(g.away,aw,'a').replace('<span class="a','<span class="a');
    return g.final?`<a class="gm" href="game.html?id=${g.id}" aria-label="${esc(g.home.short)} 対 ${esc(g.away.short)} のレポート">${inner}</a>`:`<div class="gm">${inner}</div>`;
  };
  app.innerHTML=`
  <section class="hero"><h1>Wリーグ FUTURE 分析</h1><p>${esc(WL.CONFIG.seasonLabel)}｜終了 ${done.length}試合／全 ${S.games.length}試合｜${S.live?'WJBL公式データを直接表示中':'保存データを表示中（公式データに接続できませんでした）'}</p></section>

  <section><h2>チーム<span class="en">Teams</span></h2><div class="teams">${table.map(r=>{const t=C[r.id];return `<a class="tc" href="team.html?id=${r.id}" style="--c:${t.color}"><span class="nm">${esc(t.name)}</span><span class="rec">${r.w}勝${r.l}敗</span></a>`}).join('')}</div></section>

  <section><h2>順位<span class="en">Standings</span></h2><div class="tblwrap"><table class="tbl">
    <thead><tr><th class="l">#</th><th class="l">チーム</th><th>試合</th><th>勝</th><th>敗</th><th>勝率</th><th>平均得点</th><th>平均失点</th><th>得失点差</th><th class="l">直近5試合</th></tr></thead><tbody>
    ${table.map((r,i)=>{const gp=r.w+r.l,d=r.pf-r.pa;return `<tr class="link" onclick="location.href='team.html?id=${r.id}'"><td class="l">${i+1}</td><td class="t">${WL.teamLink(r.id,C[r.id].name)}</td><td>${gp}</td><td>${r.w}</td><td>${r.l}</td><td>${gp?(r.w/gp).toFixed(3).replace(/^0/,''):'-'}</td><td>${gp?WL.f1(r.pf/gp):'-'}</td><td>${gp?WL.f1(r.pa/gp):'-'}</td><td class="${d>0?'pos':d<0?'neg':''}">${WL.signed(d)}</td><td class="l streak">${r.res.slice(-5).map(x=>`<b style="background:var(--${x==='W'?'win':'loss'})">${x==='W'?'○':'●'}</b>`).join('')||'<span class="muted">-</span>'}</td></tr>`}).join('')}
    </tbody></table></div><p class="note">終了した試合から集計（公式順位とは同率時の扱いが異なる場合があります）。</p></section>

  <section><h2>最新の結果<span class="en">Results</span></h2>
    ${recent.length?recent.map(([d,gs])=>`<div class="day"><h3>${dlabel(d,gs[0].wd)}</h3><div class="games">${gs.map(card).join('')}</div></div>`).join(''):'<p class="muted">まだ終了した試合はありません。</p>'}
    ${done.length>recent.reduce((a,[,g])=>a+g.length,0)?`<details><summary style="cursor:pointer;font-size:.88rem">それ以前の結果をすべて表示</summary><div style="margin-top:12px">${byDate(done).slice(0,-3).reverse().map(([d,gs])=>`<div class="day"><h3>${dlabel(d,gs[0].wd)}</h3><div class="games">${gs.map(card).join('')}</div></div>`).join('')}</div></details>`:''}
  </section>

  <section><h2>今後の試合<span class="en">Upcoming</span></h2>
    ${upcoming.length?upcoming.map(([d,gs])=>`<div class="day"><h3>${dlabel(d,gs[0].wd)}</h3><div class="games">${gs.map(card).join('')}</div></div>`).join(''):'<p class="muted">予定されている試合はありません。</p>'}
  </section>
  <footer class="site">データ出典：WJBL公式サイト。試合終了直後から「速報」として表示し、公式記録が確定すると自動で通常表示に切り替わります。</footer>`;
})();
</script>
</body>
</html>
