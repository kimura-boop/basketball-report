name: Wリーグ FUTURE データ保存

on:
  schedule:
    # 毎週月曜 3:00（日本時間）= 日曜 18:00 UTC
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 終了試合のデータを保存
        run: node scripts/wleague-cache.mjs
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add wleague/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Wリーグ FUTURE データを更新"
            git push
          fi
